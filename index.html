<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌾 无尽农场</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #16211a;
    --panel: #1e2c22;
    --panel2: #26382c;
    --border: #35513c;
    --text: #e6f2e4;
    --dim: #8fa895;
    --green: #5ec46a;
    --gold: #f5c542;
    --red: #e06b6b;
    --blue: #6fa8dc;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(circle at 50% 0%, #22342a 0%, #16211a 70%);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 1.2s ease;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: linear-gradient(180deg, #22362a, #1a2820);
    border-bottom: 2px solid var(--border);
    flex-wrap: wrap;
  }
  .stat {
    display: flex; align-items: center; gap: 4px;
    background: #14201a; border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 9px;
    font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .stat .ico { font-size: 14px; }
  #moneyEl { color: var(--gold); }
  .spacer { flex: 1 1 auto; }
  .icon-btn {
    background: #14201a; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .icon-btn:active { transform: scale(.94); }

  main {
    flex: 1 1 auto;
    display: flex; gap: 10px; padding: 10px;
    overflow: hidden; min-height: 0;
  }
  .left { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 8px; }
  .toolbar { display: flex; gap: 6px; flex: 0 0 auto; flex-wrap: wrap; }
  .tool {
    flex: 1 1 0; background: var(--panel); border: 2px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 8px 4px;
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: all .12s; white-space: nowrap;
  }
  .tool.active {
    background: linear-gradient(180deg, #3d6b46, #2d5235);
    border-color: var(--green);
    box-shadow: 0 0 12px rgba(94,196,106,.35);
  }
  .tool:active { transform: scale(.96); }

  .farm-scroll {
    flex: 1 1 auto; overflow: auto; display: flex;
    align-items: flex-start; justify-content: center;
    min-height: 0; padding-bottom: 4px;
  }
  #farm {
    display: grid; gap: 4px; width: 100%;
    max-width: 560px; margin: 0 auto;
  }
  .tile {
    aspect-ratio: 1 / 1; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(15px, 3.6vw, 26px); cursor: pointer;
    position: relative; transition: transform .08s, filter .15s;
    line-height: 1; overflow: hidden;
  }
  .tile:active { transform: scale(.9); filter: brightness(1.25); }
  .tile.grass { background: linear-gradient(160deg, #46703f, #33562f); box-shadow: inset 0 0 0 1px #2a4527; }
  .tile.tilled { background: linear-gradient(160deg, #8a6544, #6b4d33); box-shadow: inset 0 0 0 1px #5a3f2a; }
  .tile.tilled.watered { background: linear-gradient(160deg, #5d6b52, #47523f); box-shadow: inset 0 0 0 1px #3a4433; }
  .tile.planted { background: linear-gradient(160deg, #8a6544, #6b4d33); box-shadow: inset 0 0 0 1px #5a3f2a; }
  .tile.planted.watered { background: linear-gradient(160deg, #6d5a3e, #52432f); }
  .tile.ready {
    background: linear-gradient(160deg, #6b8f4a, #4d6b33);
    box-shadow: inset 0 0 0 2px var(--gold), 0 0 10px rgba(245,197,66,.45);
    animation: readyPulse 1.6s ease-in-out infinite;
  }
  @keyframes readyPulse {
    0%,100% { box-shadow: inset 0 0 0 2px var(--gold), 0 0 8px rgba(245,197,66,.35); }
    50% { box-shadow: inset 0 0 0 2px #ffe07a, 0 0 16px rgba(245,197,66,.7); }
  }
  .tile.locked {
    background: #14201a; box-shadow: inset 0 0 0 1px #223028;
    opacity: .5; font-size: 14px; cursor: default;
  }
  .tile .water-dot { position: absolute; right: 3px; bottom: 2px; font-size: 9px; opacity: .9; }

  .panel {
    flex: 0 0 340px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; min-height: 0;
  }
  .tabs {
    display: flex; flex: 0 0 auto;
    background: #17241c; border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1; background: none; border: none; color: var(--dim);
    padding: 9px 2px; font-size: 12px; font-family: inherit;
    cursor: pointer; border-bottom: 2px solid transparent; font-weight: 600;
  }
  .tab.active { color: var(--green); border-bottom-color: var(--green); background: #1e2c22; }
  #panelContent {
    flex: 1 1 auto; overflow-y: auto; padding: 10px; min-height: 0;
  }
  #panelContent::-webkit-scrollbar { width: 6px; }
  #panelContent::-webkit-scrollbar-thumb { background: #35513c; border-radius: 3px; }

  .sec-title {
    font-size: 12px; font-weight: 700; color: var(--dim);
    margin: 12px 0 6px; letter-spacing: .5px;
  }
  .sec-title:first-child { margin-top: 0; }

  .item-row {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel2); border: 1px solid #2e4234;
    border-radius: 8px; padding: 7px 9px; margin-bottom: 5px;
    font-size: 13px;
  }
  .item-emoji { font-size: 17px; width: 22px; text-align: center; }
  .item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-sub { font-size: 11px; color: var(--dim); }
  .item-count { color: var(--gold); font-weight: 700; font-size: 12px; }

  .mini-btn {
    background: #33513b; border: 1px solid #446b4e; color: var(--text);
    border-radius: 6px; padding: 4px 8px; font-size: 11px;
    font-family: inherit; cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .mini-btn:active { transform: scale(.93); }
  .mini-btn.buy { background: #3d5a2a; border-color: #5c8a3c; }
  .mini-btn.sell { background: #5a4a20; border-color: #8a7028; }
  .mini-btn:disabled { opacity: .35; cursor: default; }

  .locked-row { opacity: .45; }

  .empty { color: var(--dim); font-size: 12px; text-align: center; padding: 24px 8px; line-height: 1.7; }

  .big-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(180deg, #3d6b46, #2d5235);
    border: 2px solid var(--green); color: #fff; border-radius: 10px;
    font-size: 15px; font-weight: 700; font-family: inherit;
    cursor: pointer; margin-bottom: 8px;
  }
  .big-btn:active { transform: scale(.97); }
  .big-btn:disabled { opacity: .4; }

  .bar-wrap {
    height: 8px; background: #14201a; border-radius: 4px; overflow: hidden; margin-top: 4px;
  }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #5ec46a, #8ee69a); transition: width .3s; }

  .quest-row {
    background: var(--panel2); border: 1px solid #2e4234;
    border-radius: 8px; padding: 9px; margin-bottom: 6px; font-size: 12px;
  }
  .quest-row.done { border-color: var(--gold); background: #2e3020; }
  .quest-head { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: 600; }
  .quest-reward { color: var(--gold); font-size: 11px; }

  #toasts {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    display: flex; flex-direction: column-reverse; align-items: center; gap: 6px;
    pointer-events: none; z-index: 300; width: 90%; max-width: 420px;
  }
  .toast {
    background: rgba(20,32,26,.96); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    animation: toastIn .2s ease-out; text-align: center;
  }
  .toast.out { opacity: 0; transform: translateY(-6px); transition: all .3s; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

  .modal {
    position: fixed; inset: 0; background: rgba(8,14,10,.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 250; padding: 16px; backdrop-filter: blur(3px);
  }
  .modal.hidden { display: none; }
  .modal-box {
    background: linear-gradient(180deg, #22362a, #1a2820);
    border: 2px solid var(--border); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 400px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
  }
  #fishTitle { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  #fishMsg { font-size: 13px; color: var(--dim); min-height: 34px; margin: 10px 0; line-height: 1.5; }
  #fishBar {
    position: relative; height: 42px; background: #0e1812;
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; margin: 14px 0;
  }
  #fishBar.hidden { display: none; }
  #fishTarget {
    position: absolute; top: 0; bottom: 0;
    background: linear-gradient(180deg, #6fe07a, #2f9b45); border-radius: 4px;
  }
  #fishPointer {
    position: absolute; top: -2px; bottom: -2px; width: 5px;
    background: #fff; box-shadow: 0 0 10px #fff, 0 0 20px rgba(255,255,255,.6);
    transform: translateX(-50%); border-radius: 3px;
  }

  .day-overlay {
    position: fixed; inset: 0; background: rgba(8,14,10,.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 280; gap: 10px; animation: fadeIn .3s;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .day-overlay .big-emoji { font-size: 64px; }
  .day-overlay .big-text { font-size: 26px; font-weight: 800; }
  .day-overlay .sub { color: var(--dim); font-size: 14px; }

  @media (max-width: 820px) {
    main { flex-direction: column; padding: 8px; gap: 8px; }
    .panel { flex: 0 0 auto; height: 42%; min-height: 200px; }
    .left { flex: 1 1 auto; min-height: 0; }
    header { padding: 6px 8px; gap: 5px; }
    .stat { font-size: 11px; padding: 3px 7px; }
    .tool { font-size: 11px; padding: 7px 2px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><span class="ico">📅</span><span id="dayEl">第 1 天</span></div>
    <div class="stat"><span class="ico">🕐</span><span id="timeEl">06:00</span></div>
    <div class="stat"><span class="ico" id="weatherIco">☀️</span><span id="weatherEl">晴天</span></div>
    <div class="stat"><span class="ico">💰</span><span id="moneyEl">0</span></div>
    <div class="stat"><span class="ico">💧</span><span id="waterEl">30/30</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="pauseBtn">⏸</button>
    <button class="icon-btn" id="saveBtn">💾</button>
  </header>

  <main>
    <div class="left">
      <div class="toolbar">
        <button class="tool active" data-tool="hoe">🪓 开垦</button>
        <button class="tool" data-tool="water">💧 浇水</button>
        <button class="tool" data-tool="seed">🌱 播种</button>
      </div>
      <div class="farm-scroll">
        <div id="farm"></div>
      </div>
    </div>

    <aside class="panel">
      <nav class="tabs">
        <button class="tab active" data-tab="bag">🎒背包</button>
        <button class="tab" data-tab="shop">🏪商店</button>
        <button class="tab" data-tab="market">💰市场</button>
        <button class="tab" data-tab="fish">🎣钓鱼</button>
        <button class="tab" data-tab="quest">📋任务</button>
      </nav>
      <div id="panelContent"></div>
    </aside>
  </main>
</div>

<div id="toasts"></div>

<div id="fishModal" class="modal hidden">
  <div class="modal-box">
    <div id="fishTitle">🎣 抛竿中...</div>
    <div id="fishBar" class="hidden">
      <div id="fishTarget"></div>
      <div id="fishPointer"></div>
    </div>
    <div id="fishMsg"></div>
    <button class="big-btn" id="fishAction">收竿</button>
    <button class="icon-btn" id="fishClose" style="width:100%">关闭</button>
  </div>
</div>

<script>
/* ============================================================
   🌾 无尽农场  —  单文件农场经营游戏 v2
   ============================================================ */

const GRID_W = 8;
const GRID_H = 8;

const ROD_PRICE   = 150;   // 钓鱼竿价格
const BAIT_PRICE  = 12;    // 鱼饵单价
const BAIT_LIMIT  = 5;     // 每日鱼饵限购

const CROPS = {
  turnip:     { name:'萝卜',    emoji:'🥬', days:2,  seed:20,   sell:45,    xp:6,   lv:1  },
  carrot:     { name:'胡萝卜',  emoji:'🥕', days:3,  seed:40,   sell:95,    xp:10,  lv:1  },
  potato:     { name:'土豆',    emoji:'🥔', days:4,  seed:70,   sell:175,   xp:16,  lv:2  },
  tomato:     { name:'番茄',    emoji:'🍅', days:5,  seed:120,  sell:310,   xp:24,  lv:3  },
  strawberry: { name:'草莓',    emoji:'🍓', days:5,  seed:165,  sell:420,   xp:30,  lv:4  },
  corn:       { name:'玉米',    emoji:'🌽', days:6,  seed:210,  sell:540,   xp:40,  lv:5  },
  sunflower:  { name:'向日葵',  emoji:'🌻', days:6,  seed:270,  sell:700,   xp:50,  lv:6  },
  blueberry:  { name:'蓝莓',    emoji:'🫐', days:7,  seed:350,  sell:920,   xp:66,  lv:8  },
  pumpkin:    { name:'南瓜',    emoji:'🎃', days:8,  seed:470,  sell:1250,  xp:90,  lv:10 },
  grape:      { name:'葡萄',    emoji:'🍇', days:8,  seed:600,  sell:1620,  xp:115, lv:12 },
  melon:      { name:'甜瓜',    emoji:'🍈', days:9,  seed:780,  sell:2200,  xp:150, lv:14 },
  watermelon: { name:'西瓜',    emoji:'🍉', days:10, seed:1000, sell:2900,  xp:190, lv:17 },
  dragonfruit:{ name:'火龙果',  emoji:'🌺', days:11, seed:1450, sell:4400,  xp:260, lv:20 },
  goldenwheat:{ name:'金麦',    emoji:'🌾', days:12, seed:2300, sell:7100,  xp:380, lv:24 },
  starfruit:  { name:'星之果',  emoji:'⭐', days:13, seed:3800, sell:12000, xp:560, lv:28 },
};

const FISH = {
  crucian:  { name:'鲫鱼',    emoji:'🐟', price:30,    rarity:1, diff:0.55, xp:8   },
  carp:     { name:'鲤鱼',    emoji:'🐠', price:55,    rarity:1, diff:0.65, xp:12  },
  bass:     { name:'鲈鱼',    emoji:'🐟', price:110,   rarity:2, diff:0.80, xp:22  },
  salmon:   { name:'三文鱼',  emoji:'🐟', price:200,   rarity:2, diff:0.90, xp:34  },
  catfish:  { name:'鲶鱼',    emoji:'🐡', price:350,   rarity:3, diff:1.05, xp:58  },
  puffer:   { name:'河豚',    emoji:'🐡', price:600,   rarity:3, diff:1.20, xp:85  },
  squid:    { name:'鱿鱼',    emoji:'🦑', price:1000,  rarity:4, diff:1.40, xp:130 },
  octopus:  { name:'章鱼',    emoji:'🐙', price:1700,  rarity:4, diff:1.55, xp:190 },
  shark:    { name:'鲨鱼',    emoji:'🦈', price:4000,  rarity:5, diff:1.80, xp:320 },
  whale:    { name:'鲸鱼',    emoji:'🐋', price:10000, rarity:6, diff:2.10, xp:600 },
};

const WEATHER = {
  sunny:  { name:'晴天', emoji:'☀️', color:'#f5c542', sky:['#2c4f33', '#16211a'] },
  cloudy: { name:'阴天', emoji:'☁️', color:'#9aa9b5', sky:['#3a4649', '#1a2024'] },
  rain:   { name:'雨天', emoji:'🌧️', color:'#6fa8dc', waters:true, sky:['#2a3d4a', '#131d24'] },
  storm:  { name:'暴雨', emoji:'⛈️', color:'#5b7fa8', waters:true, rareBonus:true, sky:['#232f3d', '#0e141a'] },
  hot:    { name:'酷暑', emoji:'🔥', color:'#e06666', rareBonus:true, sky:['#4a3020', '#1f1410'] },
  wind:   { name:'大风', emoji:'🌬️', color:'#a8c3b0', sky:['#3a4a42', '#18211c'] },
};

const $ = id => document.getElementById(id);
const fmt = n => Math.floor(n).toLocaleString('zh-CN');
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));

function basePrice(id) {
  if (id === 'bait') return BAIT_PRICE;
  if (id.startsWith('seed_')) { const c = CROPS[id.slice(5)]; return c ? c.seed : 10; }
  if (id.startsWith('crop_')) { const c = CROPS[id.slice(5)]; return c ? c.sell : 10; }
  if (id.startsWith('fish_')) { const f = FISH[id.slice(5)]; return f ? f.price : 10; }
  return 10;
}

function itemInfo(id) {
  if (id === 'bait') return { name:'鱼饵', emoji:'🪱', type:'bait' };
  if (id.startsWith('seed_')) {
    const c = CROPS[id.slice(5)];
    return { name: (c ? c.name : '?') + '种子', emoji: '🌱', type: 'seed', cropId: id.slice(5) };
  }
  if (id.startsWith('crop_')) {
    const c = CROPS[id.slice(5)];
    return { name: c ? c.name : '?', emoji: c ? c.emoji : '❓', type: 'crop', cropId: id.slice(5) };
  }
  if (id.startsWith('fish_')) {
    const f = FISH[id.slice(5)];
    return { name: f ? f.name : '?', emoji: f ? f.emoji : '🐟', type: 'fish', fishId: id.slice(5) };
  }
  return { name: '未知', emoji: '❓', type: 'other' };
}

/* ---------------- 存档 ---------------- */

const SAVE_KEY = 'infinite_farm_save_v1';
const SAVE_VER = 2;

function defaultState() {
  const tiles = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      tiles.push({ x, y, unlocked: y < 2, tilled: false, watered: false, crop: null });
    }
  }
  return {
    day: 1,
    time: 6 * 60,
    money: 0,                  // 开局不给金币
    weather: 'sunny',
    tiles,
    inv: { seed_turnip: 8, seed_carrot: 4 },
    water: 30,
    waterMax: 30,
    rodLvl: 0,                 // 0 = 尚未购买钓鱼竿
    canLvl: 1,
    baitBought: 0,             // 今日已购买鱼饵数量
    selectedTool: 'hoe',
    selectedSeed: null,
    skills: {
      farm: { lvl: 1, xp: 0 },
      fish: { lvl: 1, xp: 0 },
      trade:{ lvl: 1, xp: 0 },
    },
    quests: [],
    market: {},
    demand: [],
    stats: { harvest: 0, fish: 0, earned: 0, days: 0, planted: 0 },
    questsDay: 0,
  };
}

let state = defaultState();

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: SAVE_VER, state }));
    return true;
  } catch (e) { console.warn('保存失败', e); return false; }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.v !== SAVE_VER || !data.state) return false;
    const def = defaultState();
    const merged = Object.assign(def, data.state);
    merged.skills = Object.assign(def.skills, data.state.skills || {});
    merged.stats  = Object.assign(def.stats,  data.state.stats  || {});
    merged.inv    = data.state.inv || {};
    merged.market = data.state.market || {};
    merged.demand = data.state.demand || [];
    merged.tiles  = (data.state.tiles && data.state.tiles.length === GRID_W * GRID_H)
      ? data.state.tiles : def.tiles;
    state = merged;
    return true;
  } catch (e) { console.warn('读档失败', e); return false; }
}

/* ---------------- 技能 ---------------- */

function xpNeed(lvl) { return Math.floor(100 * Math.pow(1.38, lvl - 1)); }

function addXp(skill, amount) {
  const s = state.skills[skill];
  if (!s) return;
  s.xp += amount;
  let leveled = false;
  while (s.xp >= xpNeed(s.lvl)) { s.xp -= xpNeed(s.lvl); s.lvl++; leveled = true; }
  if (leveled) {
    const names = { farm: '农业', fish: '钓鱼', trade: '商业' };
    toast(`🎉 ${names[skill]}等级提升到 Lv.${s.lvl}！`, 2200);
    refresh();
  }
}

/* ---------------- 天气 ---------------- */

function rollWeather() {
  const r = Math.random();
  if (r < 0.38) return 'sunny';
  if (r < 0.55) return 'cloudy';
  if (r < 0.74) return 'rain';
  if (r < 0.82) return 'storm';
  if (r < 0.90) return 'hot';
  return 'wind';
}

/* ---------------- 市场 ---------------- */

function rollMarket() {
  state.market = {};
  Object.keys(CROPS).forEach(id => { state.market['crop_' + id] = rand(0.80, 1.30); });
  Object.keys(FISH).forEach(id => { state.market['fish_' + id] = rand(0.80, 1.30); });

  state.demand = [];
  const pool = Object.keys(CROPS).filter(id => state.skills.farm.lvl >= CROPS[id].lv - 2);
  const n = Math.min(2, pool.length);
  for (let i = 0; i < n; i++) {
    const idx = randInt(0, pool.length - 1);
    state.demand.push('crop_' + pool.splice(idx, 1)[0]);
  }
}

function sellPriceOf(id) {
  const base = basePrice(id);
  const m = state.market[id] ?? 1;
  const demandMul = state.demand.includes(id) ? 3 : 1;
  const tradeBonus = 1 + (state.skills.trade.lvl - 1) * 0.03;
  return Math.max(1, Math.floor(base * m * demandMul * tradeBonus));
}

/* ---------------- 任务 ---------------- */

function newQuests() {
  const fl = state.skills.farm.lvl;
  const fis = state.skills.fish.lvl;
  state.quests = [
    { id:'harvest', progress:0, target: 5 + fl * 2, reward: 120 + fl * 45, desc: n => `收获 ${n} 个作物` },
    { id:'fish', progress:0, target: 2 + Math.floor(fis / 2), reward: 160 + fis * 60, desc: n => `钓到 ${n} 条鱼` },
    { id:'earn', progress:0, target: 400 + fl * 220, reward: 250 + fl * 70, desc: n => `通过卖东西赚取 ${fmt(n)} 金币` },
  ];
  state.questsDay = state.day;
}

function addQuestProgress(type, amount) {
  let changed = false;
  state.quests.forEach(q => {
    if (q.id === type && q.progress < q.target) {
      q.progress = Math.min(q.target, q.progress + amount);
      changed = true;
    }
  });
  if (changed && currentTab === 'quest') renderPanel();
}

/* ---------------- 背包 ---------------- */

function addItem(id, n = 1) { state.inv[id] = (state.inv[id] || 0) + n; }
function removeItem(id, n = 1) {
  if (!state.inv[id] || state.inv[id] < n) return false;
  state.inv[id] -= n;
  if (state.inv[id] <= 0) delete state.inv[id];
  return true;
}

/* ---------------- Toast ---------------- */

function toast(msg, dur = 1600) {
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, dur);
  while (box.children.length > 5) box.firstChild.remove();
}

/* ---------------- 顶栏 & 背景 ---------------- */

function renderTop() {
  $('dayEl').textContent = `第 ${state.day} 天`;
  const h = Math.floor(state.time / 60) % 24;
  const m = Math.floor(state.time % 60);
  $('timeEl').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  $('moneyEl').textContent = fmt(state.money);

  const w = WEATHER[state.weather] || WEATHER.sunny;
  $('weatherEl').textContent = w.name;
  $('weatherIco').textContent = w.emoji;
  $('waterEl').textContent = `${state.water}/${state.waterMax}`;

  const sky = w.sky || ['#2c4f33', '#16211a'];
  document.body.style.background =
    `radial-gradient(circle at 50% 0%, ${sky[0]} 0%, ${sky[1]} 70%)`;
}

/* ---------------- 农场 ---------------- */

const farmEl = $('farm');
let tileEls = [];

function buildFarm() {
  farmEl.innerHTML = '';
  farmEl.style.gridTemplateColumns = `repeat(${GRID_W}, 1fr)`;
  tileEls = [];
  state.tiles.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'tile grass';
    d.addEventListener('click', () => onTileClick(i));
    farmEl.appendChild(d);
    tileEls.push(d);
  });
  updateFarm();
}

function updateFarm() {
  state.tiles.forEach((t, i) => {
    const d = tileEls[i];
    if (!d) return;
    let cls = 'tile';
    let html = '';

    if (!t.unlocked) {
      cls += ' locked'; html = '🔒';
    } else if (t.crop) {
      const c = CROPS[t.crop.id];
      cls += ' planted';
      if (t.watered) cls += ' watered';
      if (t.crop.growth >= c.days) {
        cls += ' ready'; html = c.emoji;
      } else {
        const p = t.crop.growth / c.days;
        html = p < 0.45 ? '🌱' : '🌿';
      }
    } else if (t.tilled) {
      cls += ' tilled';
      if (t.watered) cls += ' watered';
      html = t.watered ? '<span class="water-dot">💧</span>' : '';
    } else {
      cls += ' grass';
    }
    d.className = cls;
    d.innerHTML = html;
  });
}

/* ---------------- 农场交互 ---------------- */

function onTileClick(i) {
  const t = state.tiles[i];
  if (!t.unlocked) { toast('这块地还没有解锁，去商店扩展农场吧'); return; }

  if (t.crop && t.crop.growth >= CROPS[t.crop.id].days) { harvest(i); return; }

  const tool = state.selectedTool;

  if (tool === 'hoe') {
    if (t.crop) { toast('这里有作物在生长'); return; }
    if (t.tilled) { toast('已经开垦过了'); return; }
    t.tilled = true; t.watered = false;
    addXp('farm', 2);
    updateFarm();
  } else if (tool === 'water') {
    if (!t.tilled) { toast('先用锄头开垦这块地'); return; }
    if (t.watered) { toast('已经浇过水了'); return; }
    if (state.water <= 0) { toast('💧 水壶空了！明天会自动装满'); return; }
    state.water--; t.watered = true;
    addXp('farm', 1);
    updateFarm(); renderTop();
  } else if (tool === 'seed') {
    if (!state.selectedSeed) { toast('请先在背包里选择一种种子'); return; }
    if (!t.tilled) { toast('先用锄头开垦这块地'); return; }
    if (t.crop) { toast('这块地已经有作物了'); return; }
    const sid = state.selectedSeed;
    if (!state.inv[sid]) { toast('种子不足'); state.selectedSeed = null; refresh(); return; }
    const cropId = sid.slice(5);
    removeItem(sid, 1);
    t.crop = { id: cropId, growth: 0 };
    state.stats.planted++;
    if (!state.inv[sid]) state.selectedSeed = null;
    updateFarm(); refresh();
  }
}

function harvest(i) {
  const t = state.tiles[i];
  if (!t.crop) return;
  const c = CROPS[t.crop.id];
  if (t.crop.growth < c.days) { toast('还没成熟呢'); return; }

  let qty = 1;
  const lvl = state.skills.farm.lvl;
  if (Math.random() < 0.03 * lvl) qty++;
  if (Math.random() < 0.012 * lvl) qty++;

  addItem('crop_' + t.crop.id, qty);
  addXp('farm', c.xp);
  state.stats.harvest += qty;
  addQuestProgress('harvest', qty);

  t.crop = null; t.tilled = true; t.watered = false;

  toast(`${c.emoji} 收获 ${c.name} ×${qty}`, 1400);
  updateFarm(); refresh(); saveGame();
}

/* ---------------- 时间循环 ---------------- */

let paused = false;
let lastTick = performance.now();
let timeAccum = 0;
const MS_PER_GAME_MIN = 100;

function tick(ts) {
  requestAnimationFrame(tick);
  const dt = Math.min(300, ts - lastTick);
  lastTick = ts;
  if (paused || document.hidden) return;

  timeAccum += dt;
  let added = 0;
  while (timeAccum >= MS_PER_GAME_MIN) { timeAccum -= MS_PER_GAME_MIN; added++; }
  if (added > 0) {
    state.time += added;
    if (state.time >= 24 * 60) endDay(true);
    renderTop();
  }
}

/* ---------------- 日结算 ---------------- */

function endDay(auto) {
  state.tiles.forEach(t => {
    if (t.crop && t.watered) {
      const c = CROPS[t.crop.id];
      if (t.crop.growth < c.days) t.crop.growth++;
    }
  });

  state.day++;
  state.stats.days++;
  state.time = 6 * 60;
  state.water = state.waterMax;
  state.baitBought = 0;          // 重置鱼饵限购

  state.weather = rollWeather();
  const w = WEATHER[state.weather];

  state.tiles.forEach(t => { t.watered = false; });
  if (w.waters) state.tiles.forEach(t => { if (t.tilled) t.watered = true; });

  rollMarket();
  newQuests();

  updateFarm(); renderTop(); refresh(); saveGame();
  if (auto) showDayOverlay();
}

function showDayOverlay() {
  const w = WEATHER[state.weather];
  const ov = document.createElement('div');
  ov.className = 'day-overlay';
  ov.innerHTML = `
    <div class="big-emoji">${w.emoji}</div>
    <div class="big-text">第 ${state.day} 天</div>
    <div class="sub">${w.name}${w.waters ? ' · 作物自动浇水' : ''}</div>
  `;
  document.body.appendChild(ov);
  setTimeout(() => {
    ov.style.transition = 'opacity .5s';
    ov.style.opacity = '0';
    setTimeout(() => ov.remove(), 520);
  }, 1100);
}

/* ---------------- 面板 ---------------- */

let currentTab = 'bag';
const panelContent = $('panelContent');

function refresh() { renderTop(); updateFarm(); renderPanel(); }

function renderPanel() {
  switch (currentTab) {
    case 'bag':    panelContent.innerHTML = renderBag(); break;
    case 'shop':   panelContent.innerHTML = renderShop(); break;
    case 'market': panelContent.innerHTML = renderMarket(); break;
    case 'fish':   panelContent.innerHTML = renderFishPanel(); break;
    case 'quest':  panelContent.innerHTML = renderQuestPanel(); break;
  }
}

/* ---- 背包 ---- */
function renderBag() {
  const entries = Object.entries(state.inv).filter(([k, v]) => v > 0);
  if (!entries.length) return '<div class="empty">背包空空如也<br>去 🏪 商店买些种子开始吧</div>';

  const order = { seed: 0, crop: 1, fish: 2, bait: 3, other: 4 };
  entries.sort((a, b) => {
    const ia = itemInfo(a[0]), ib = itemInfo(b[0]);
    return (order[ia.type] - order[ib.type]) || ia.name.localeCompare(ib.name);
  });

  let html = '';
  entries.forEach(([id, n]) => {
    const info = itemInfo(id);
    const selected = state.selectedSeed === id;
    let btn = '';
    if (info.type === 'seed') {
      btn = `<button class="mini-btn" data-act="selectSeed" data-id="${id}" style="${selected ? 'background:#5ec46a;color:#0d1a10;border-color:#8ee69a;' : ''}">${selected ? '✓已选' : '选择'}</button>`;
    } else if (info.type === 'bait') {
      btn = `<span class="item-sub">钓鱼消耗</span>`;
    } else {
      btn = `<button class="mini-btn sell" data-act="sellOne" data-id="${id}">卖 ${fmt(sellPriceOf(id))}</button>`;
    }
    html += `<div class="item-row">
      <span class="item-emoji">${info.emoji}</span>
      <span class="item-name">${info.name}</span>
      <span class="item-count">×${n}</span>
      ${btn}
    </div>`;
  });

  html += `<div class="sec-title">📊 技能</div>`;
  html += skillRow('🌾 农业', state.skills.farm, '解锁作物 · 双倍收获');
  html += skillRow('🎣 钓鱼', state.skills.fish, '更大判定区 · 稀有鱼');
  html += skillRow('💼 商业', state.skills.trade, '售价加成');
  return html;
}

function skillRow(name, s, desc) {
  const need = xpNeed(s.lvl);
  const pct = Math.min(100, (s.xp / need) * 100);
  return `<div class="item-row" style="flex-direction:column;align-items:stretch;gap:3px;">
    <div style="display:flex;justify-content:space-between;">
      <span style="font-weight:700;">${name} Lv.${s.lvl}</span>
      <span class="item-sub">${s.xp}/${need}</span>
    </div>
    <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="item-sub">${desc}</div>
  </div>`;
}

/* ---- 市场 ---- */
function renderMarket() {

  Object.keys(CROPS).forEach(id => {
    const itemId = 'crop_' + id;
    if (state.inv[itemId]) sellable.push(itemId);
  });
  Object.keys(FISH).forEach(id => {
    const itemId = 'fish_' + id;
    if (state.inv[itemId]) sellable.push(itemId);
  });

  let html = '';

  if (state.demand.length) {
    const names = state.demand.map(id => {
      const c = CROPS[id.slice(5)];

        <span class="item-sub">${fmt(q.progress)} / ${fmt(q.target)}</span>
        ${done
          ? `<button class="mini-btn buy" data-act="claimQuest" data-id="${idx}">领取奖励</button>`
          : `<span class="item-sub">进行中</span>`}
      </div>
    </div>`;
  });

  html += `<div class="sec-title">📈 统计</div>
    <div class="item-row"><span class="item-emoji">🌾</span><span class="item-name">累计收获</span><span class="item-count">${fmt(state.stats.harvest)}</span></div>
    <div class="item-row"><span class="item-emoji">🐟</span><span class="item-name">累计钓鱼</span><span class="item-count">${fmt(state.stats.fish)}</span></div>
    <div class="item-row"><span class="item-emoji">💵</span><span class="item-name">累计赚取</span><span class="item-count">${fmt(state.stats.earned)}</span></div>
    <div class="item-row"><span class="item-emoji">🌱</span><span class="item-name">累计播种</span><span class="item-count">${fmt(state.stats.planted)}</span></div>
    <div class="item-row"><span class="item-emoji">📅</span><span class="item-name">经营天数</span><span class="item-count">${fmt(state.day)}</span></div>
  `;
  return html;
}

/* ---------------- 面板点击 ---------------- */

panelContent.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;

  if (act === 'selectSeed') {
    state.selectedSeed = (state.selectedSeed === id) ? null : id;
    if (state.selectedSeed) state.selectedTool = 'seed';
    updateToolButtons(); renderPanel();
    if (state.selectedSeed) toast('已选择种子，去田里点击播种吧');
  }
  else if (act === 'sellOne') sellItem(id, 1);
  else if (act === 'sellAll') sellItem(id, state.inv[id] || 0);
  else if (act === 'sellEverything') {
    let total = 0;
    Object.keys(state.inv).slice().forEach(itemId => {
      const info = itemInfo(itemId);
      if (info.type === 'seed' || info.type === 'bait') return;
      const n = state.inv[itemId];
      if (!n) return;
      const price = sellPriceOf(itemId);
      total += price * n;
      state.money += price * n;
      state.stats.earned += price * n;
      delete state.inv[itemId];
    });
    if (total > 0) {
      addXp('trade', Math.max(1, Math.floor(total / 50)));
      addQuestProgress('earn', total);
      toast(`💰 全部出售，获得 ${fmt(total)} G`, 2000);
      refresh(); saveGame();
    }
  }
  else if (act === 'buySeed') buySeed(id, parseInt(btn.dataset.n) || 1);
  else if (act === 'buyRod') {
    if (state.rodLvl > 0) return;
    if (state.money < ROD_PRICE) return;
    state.money -= ROD_PRICE;
    state.rodLvl = 1;
    toast('🎣 购买了钓鱼竿！现在可以钓鱼了', 2200);
    refresh(); saveGame();
  }
  else if (act === 'buyBait') {
    let n = parseInt(btn.dataset.n) || 1;
    const remain = BAIT_LIMIT - (state.baitBought || 0);
    n = Math.min(n, remain);
    if (n <= 0) { toast('今日鱼饵已售罄，明天再来吧'); return; }
    const cost = BAIT_PRICE * n;
    if (state.money < cost) { toast('金币不够'); return; }
    state.money -= cost;
    state.baitBought = (state.baitBought || 0) + n;
    addItem('bait', n);
    toast(`🪱 购买鱼饵 ×${n}`, 1400);
    refresh(); saveGame();
  }
  else if (act === 'upCan') {
    const cost = Math.floor(250 * Math.pow(1.9, state.canLvl - 1));
    if (state.money < cost) return;
    state.money -= cost; state.canLvl++;
    state.waterMax += 20; state.water = state.waterMax;
    toast(`💧 水壶升级！容量 ${state.waterMax}`, 2000);
    refresh(); saveGame();
  }
  else if (act === 'upRod') {
    const cost = Math.floor(350 * Math.pow(1.9, state.rodLvl - 1));
    if (state.money < cost) return;
    state.money -= cost; state.rodLvl++;
    toast(`🎣 鱼竿升级到 Lv.${state.rodLvl}！`, 2000);
    refresh(); saveGame();
  }
  else if (act === 'buyLand') {
    const rows = state.tiles.filter(t => t.unlocked).length / GRID_W;
    if (rows >= GRID_H) return;
    const cost = Math.floor(900 * Math.pow(2.1, rows - 2));
    if (state.money < cost) return;
    state.money -= cost;
    state.tiles.forEach(t => { if (t.y === rows) t.unlocked = true; });
    toast(`🗺️ 农场扩展！新增 ${GRID_W} 格土地`, 2000);
    refresh(); saveGame();
  }
  else if (act === 'claimQuest') {
    const q = state.quests[parseInt(id)];
    if (!q || q.progress < q.target) return;
    state.money += q.reward;
    state.stats.earned += q.reward;
    q.progress = q.target;
    q.target = -1;
    toast(`🎁 领取任务奖励 ${fmt(q.reward)} G`, 1800);
    state.quests = state.quests.filter(x => x.target !== -1);
    refresh(); saveGame();
  }
  else if (act === 'castRod') openFishing();
  else if (act === 'exportSave') {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify({ v: SAVE_VER, state }))));
    prompt('复制下面的存档码保存好：', code);
  }
  else if (act === 'importSave') {
    const code = prompt('粘贴存档码：');
    if (!code) return;
    try {
      const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      if (!data || data.v !== SAVE_VER || !data.state) throw new Error('格式错误');
      state = Object.assign(defaultState(), data.state);
      refresh(); saveGame();
      toast('✅ 存档导入成功');
    } catch (err) { toast('❌ 存档码无效'); }
  }
  else if (act === 'resetSave') {
    if (confirm('确定删除存档并重新开始吗？此操作不可恢复。')) {
      localStorage.removeItem(SAVE_KEY);
      state = defaultState();
      initNewGame();
      toast('新的农场生活开始了！');
    }
  }
});

function buySeed(cropId, n) {
  const c = CROPS[cropId];
  if (!c) return;
  if (state.skills.farm.lvl < c.lv) { toast('农业等级不足'); return; }
  const total = c.seed * n;
  if (state.money < total) { toast('金币不够'); return; }
  state.money -= total;
  addItem('seed_' + cropId, n);
  toast(`🌱 购买 ${c.name}种子 ×${n}`);
  refresh(); saveGame();
}

function sellItem(id, n) {
  const have = state.inv[id] || 0;
  n = Math.min(n, have);
  if (n <= 0) return;
  const unit = sellPriceOf(id);
  const total = unit * n;
  removeItem(id, n);
  state.money += total;
  state.stats.earned += total;
  addXp('trade', Math.max(1, Math.floor(total / 50)));
  addQuestProgress('earn', total);
  const info = itemInfo(id);
  toast(`💰 卖出 ${info.name} ×${n}，+${fmt(total)} G`);
  refresh(); saveGame();
}

/* ---------------- 工具栏 ---------------- */

function updateToolButtons() {
  document.querySelectorAll('.tool').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tool === state.selectedTool);
  });
}

document.querySelectorAll('.tool').forEach(btn => {
  btn.addEventListener('click', () => {
    state.selectedTool = btn.dataset.tool;
    if (state.selectedTool === 'seed' && !state.selectedSeed) {
      const firstSeed = Object.keys(state.inv).find(k => k.startsWith('seed_'));
      if (firstSeed) {
        state.selectedSeed = firstSeed;
        toast('已自动选择 ' + itemInfo(firstSeed).name);
      } else {
        toast('背包里没有种子');
      }
    }
    updateToolButtons();
    if (currentTab === 'bag') renderPanel();
  });
});

/* ---------------- 标签页 ---------------- */

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    currentTab = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
    renderPanel();
  });
});

/* ---------------- 钓鱼 ---------------- */

let fishing = null;
let fishRAF = null;

const fishModal = $('fishModal');
const fishTitleEl = $('fishTitle');
const fishMsgEl = $('fishMsg');
const fishBarEl = $('fishBar');
const fishTargetEl = $('fishTarget');
const fishPointerEl = $('fishPointer');
const fishActionBtn = $('fishAction');

function openFishing() {
  if (fishing) return;
  if (state.rodLvl === 0) { toast('需要先在商店购买钓鱼竿'); return; }
  if ((state.inv['bait'] || 0) <= 0) { toast('🪱 没有鱼饵了，去商店购买'); return; }

  // 抛竿即消耗 1 个鱼饵
  removeItem('bait', 1);
  refresh();

  fishModal.classList.remove('hidden');
  fishBarEl.classList.add('hidden');
  fishMsgEl.textContent = '';
  fishTitleEl.textContent = '🎣 抛竿中...';
  fishActionBtn.textContent = '收竿';
  fishActionBtn.disabled = false;

  fishing = { phase: 'wait' };

  const wait = rand(800, 2400);
  fishing.timer = setTimeout(() => {
    if (!fishing || fishing.phase !== 'wait') return;
    startBite();
  }, wait);
}

/* 概率设计：
   普通鱼（1-2 星）占绝大多数；
   3 星及以上总计约 0.003%（万分之 0.3），鱼竿/等级/天气仅有微小加成。 */
function pickFish() {
  const rodBonus   = (state.rodLvl - 1) * 0.10;
  const fishLvlB   = (state.skills.fish.lvl - 1) * 0.03;
  const weatherB   = WEATHER[state.weather].rareBonus ? 1.8 : 1;
  const rareChance = 0.00003 * (1 + rodBonus + fishLvlB) * weatherB; // 0.003% 基准

  if (Math.random() < rareChance) {
    // 稀有鱼（3-6 星），越稀有越难出
    const rares = Object.entries(FISH).filter(([, f]) => f.rarity >= 3);
    const weights = rares.map(([, f]) => 1 / Math.pow(f.rarity, 4));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < rares.length; i++) {
      r -= weights[i];
      if (r <= 0) return { ...rares[i][1], id: rares[i][0] };
    }
    const last = rares[rares.length - 1];
    return { ...last[1], id: last[0] };
  }

  // 普通鱼：1 星为主，2 星较少
  const ones = Object.entries(FISH).filter(([, f]) => f.rarity === 1);
  const twos = Object.entries(FISH).filter(([, f]) => f.rarity === 2);
  let p2 = 0.22 + (state.rodLvl - 1) * 0.03 + (state.skills.fish.lvl - 1) * 0.01;
  p2 = Math.min(0.55, p2);
  const group = (Math.random() < p2) ? twos : ones;
  const pick = group[Math.floor(Math.random() * group.length)];
  return { ...pick[1], id: pick[0] };
}

function startBite() {
  const fish = pickFish();
  fishing.phase = 'bite';
  fishing.fish = fish;

  fishTitleEl.textContent = '❗ 上钩了！';
  fishMsgEl.textContent = '指针进入绿色区域时点击停下！';

  const rodBonus = (state.rodLvl - 1) * 2.5;
  const skillBonus = (state.skills.fish.lvl - 1) * 0.8;
  let targetW = 28 - fish.diff * 6 + rodBonus + skillBonus;
  targetW = Math.max(11, Math.min(46, targetW));

  fishing.targetW = targetW;
  fishing.targetX = rand(0, 100 - targetW);
  fishing.pos = rand(0, 100);
  fishing.dir = Math.random() < 0.5 ? 1 : -1;
  fishing.speed = 40 + fish.diff * 26;
  fishing.lastTs = 0;

  fishTargetEl.style.left = fishing.targetX + '%';
  fishTargetEl.style.width = targetW + '%';
  fishPointerEl.style.left = fishing.pos + '%';
  fishBarEl.classList.remove('hidden');
  fishActionBtn.textContent = '停下！';
  fishActionBtn.disabled = false;

  cancelAnimationFrame(fishRAF);
  fishRAF = requestAnimationFrame(loopFishing);
}

function loopFishing(ts) {
  if (!fishing || fishing.phase !== 'bite') return;
  if (!fishing.lastTs) fishing.lastTs = ts;
  const dt = Math.min(60, ts - fishing.lastTs) / 1000;
  fishing.lastTs = ts;

  fishing.pos += fishing.dir * fishing.speed * dt;
  if (fishing.pos >= 100) { fishing.pos = 100; fishing.dir = -1; }
  if (fishing.pos <= 0) { fishing.pos = 0; fishing.dir = 1; }

  fishPointerEl.style.left = fishing.pos + '%';
  fishRAF = requestAnimationFrame(loopFishing);
}

function stopFishing() {
  if (!fishing) return;

  if (fishing.phase === 'wait') {
    clearTimeout(fishing.timer);
    closeFishing();
    toast('收竿了');
    return;
  }

  if (fishing.phase === 'bite') {
    cancelAnimationFrame(fishRAF);
    const p = fishing.pos;
    const ok = p >= fishing.targetX && p <= fishing.targetX + fishing.targetW;
    const f = fishing.fish;

    if (ok) {
      addItem('fish_' + f.id, 1);
      addXp('fish', f.xp);
      state.stats.fish++;
      addQuestProgress('fish', 1);
      fishTitleEl.textContent = '🎉 钓到了！';
      fishMsgEl.textContent = `${f.emoji} ${f.name}（${'★'.repeat(f.rarity)}）价值约 ${fmt(sellPriceOf('fish_' + f.id))} G`;
    } else {
      fishTitleEl.textContent = '💨 跑掉了...';
      fishMsgEl.textContent = '鱼溜走了，再来一次吧';
    }

    fishing.phase = 'done';
    fishBarEl.classList.add('hidden');
    fishActionBtn.textContent = '再来一次';
    refresh(); saveGame();
    return;
  }

  if (fishing.phase === 'done') {
    closeFishing();
    openFishing();
  }
}

function closeFishing() {
  if (fishing && fishing.timer) clearTimeout(fishing.timer);
  cancelAnimationFrame(fishRAF);
  fishing = null;
  fishModal.classList.add('hidden');
}

fishActionBtn.addEventListener('click', stopFishing);
$('fishClose').addEventListener('click', () => {
  if (fishing && fishing.timer) clearTimeout(fishing.timer);
  closeFishing();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && fishing) { e.preventDefault(); stopFishing(); }
});

/* ---------------- 顶栏按钮 ---------------- */

$('pauseBtn').addEventListener('click', () => {
  paused = !paused;
  $('pauseBtn').textContent = paused ? '▶️' : '⏸';
  toast(paused ? '⏸ 游戏已暂停' : '▶️ 游戏继续', 1000);
});

$('saveBtn').addEventListener('click', () => {
  if (saveGame()) toast('💾 游戏已保存', 1200);
  else toast('❌ 保存失败');
});

setInterval(() => { if (!paused) saveGame(); }, 15000);
window.addEventListener('beforeunload', () => { saveGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

/* ---------------- 初始化 ---------------- */

function initNewGame() {
  rollMarket();
  newQuests();
  buildFarm();
  updateToolButtons();
  refresh();
}

function start() {
  const loaded = loadGame();

  if (loaded) {
    if (!Object.keys(state.market).length) rollMarket();
    if (!state.quests.length) newQuests();
    if (state.time < 6 * 60 || state.time >= 24 * 60) state.time = 6 * 60;
    if (state.water > state.waterMax) state.water = state.waterMax;
    if (typeof state.baitBought !== 'number') state.baitBought = 0;
  } else {
    rollMarket();
    newQuests();
  }

  buildFarm();
  updateToolButtons();
  refresh();

  if (loaded) {
    toast(`🌾 欢迎回来！第 ${state.day} 天`, 2200);
  } else {
    setTimeout(() => {
      toast('🌾 欢迎来到无尽农场！', 2400);
      setTimeout(() => toast('先开垦 → 浇水 → 播种（背包已有种子）', 3000), 800);
      setTimeout(() => toast('成熟后去市场卖钱，再买钓鱼竿', 3000), 1600);
    }, 300);
  }

  requestAnimationFrame(tick);
}

start();
</script>
